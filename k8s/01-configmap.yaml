apiVersion: v1
kind: ConfigMap
metadata:
  name: microservices-config
  namespace: microservices
  labels:
    app.kubernetes.io/part-of: microservices-task
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  USER_SERVICE_URL: "http://user-service:3000"
  PRODUCT_SERVICE_URL: "http://product-service:3001"
  ORDER_SERVICE_URL: "http://order-service:3002"
  # Keep in-cluster traffic away from any corporate HTTP(S)_PROXY (axios honours these vars)
  NO_PROXY: "localhost,127.0.0.1,.svc,.cluster.local,user-service,product-service,order-service,gateway-service,10.96.0.0/12,10.244.0.0/16"
