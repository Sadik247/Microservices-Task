apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: microservices
  labels:
    app: gateway-service
    tier: frontend
    app.kubernetes.io/part-of: microservices-task
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
        tier: frontend
        app.kubernetes.io/part-of: microservices-task
    spec:
      containers:
        - name: gateway-service
          image: gateway-service:1.0
          imagePullPolicy: IfNotPresent   # images are built inside Minikube's Docker daemon
          ports:
            - name: http
              containerPort: 3003
          env:
            - name: PORT
              value: "3003"
            - name: SERVICE_NAME
              value: "gateway-service"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef: { name: microservices-config, key: NODE_ENV }
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef: { name: microservices-config, key: LOG_LEVEL }
            # Upstream endpoints (gateway code resolves these via cluster DNS)
            - name: USER_SERVICE_URL
              valueFrom:
                configMapKeyRef: { name: microservices-config, key: USER_SERVICE_URL }
            - name: PRODUCT_SERVICE_URL
              valueFrom:
                configMapKeyRef: { name: microservices-config, key: PRODUCT_SERVICE_URL }
            - name: ORDER_SERVICE_URL
              valueFrom:
                configMapKeyRef: { name: microservices-config, key: ORDER_SERVICE_URL }
            # Proxy handling: bypass any HTTP(S)_PROXY for in-cluster calls
            - name: NO_PROXY
              valueFrom:
                configMapKeyRef: { name: microservices-config, key: NO_PROXY }
            - name: no_proxy
              valueFrom:
                configMapKeyRef: { name: microservices-config, key: NO_PROXY }
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service          # must match the hostname used by the gateway
  namespace: microservices
  labels:
    app: gateway-service
    app.kubernetes.io/part-of: microservices-task
spec:
  type: ClusterIP
  selector:
    app: gateway-service
  ports:
    - name: http
      port: 3003
      targetPort: http
      protocol: TCP
---
# Optional external entry point for the gateway (minikube service / NodePort)
apiVersion: v1
kind: Service
metadata:
  name: gateway-service-external
  namespace: microservices
  labels:
    app: gateway-service
    app.kubernetes.io/part-of: microservices-task
spec:
  type: NodePort
  selector:
    app: gateway-service
  ports:
    - name: http
      port: 3003
      targetPort: http
      nodePort: 30003
