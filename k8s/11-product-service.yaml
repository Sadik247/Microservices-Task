apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: microservices
  labels:
    app: product-service
    tier: backend
    app.kubernetes.io/part-of: microservices-task
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
        tier: backend
        app.kubernetes.io/part-of: microservices-task
    spec:
      containers:
        - name: product-service
          image: product-service:1.0
          imagePullPolicy: IfNotPresent   # images are built inside Minikube's Docker daemon
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: SERVICE_NAME
              value: "product-service"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef: { name: microservices-config, key: NODE_ENV }
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef: { name: microservices-config, key: LOG_LEVEL }

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: product-service          # must match the hostname used by the gateway
  namespace: microservices
  labels:
    app: product-service
    app.kubernetes.io/part-of: microservices-task
spec:
  type: ClusterIP
  selector:
    app: product-service
  ports:
    - name: http
      port: 3001
      targetPort: http
      protocol: TCP
